    <style>
        :root {
            --bg-color: #030712;        
            --card-bg: #111827;         
            --text-main: #f3f4f6;       
            --text-muted: #9ca3af;      
            --border-color: #1f2937;    
            --secondary-color: #38bdf8; 
            --header-bg: linear-gradient(135deg, #0f172a, #1e1b4b);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;        
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --secondary-color: #0284c7;
            --header-bg: linear-gradient(135deg, #e0f2fe, #bae6fd);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
            padding: 15px;
        }
        
        .wrapper {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        
        header {
            background: var(--header-bg);
            color: var(--text-main);
            padding: 30px;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .logo-area h1 { font-size: 2.5rem; font-weight: 800; }
        .logo-area h1 span { color: var(--secondary-color); }
        .logo-area p { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; }

        .header-actions {
            position: absolute;
            top: 15px;
            right: 15px;
        }

        .theme-toggle {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
        }
        
        .controls {
            padding: 15px 30px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; width: 100%; }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 8px 14px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            outline: none;
        }
        
        .controls select, .controls button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .filter-select {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        
        .btn-refresh { background-color: #4f46e5; color: white; }
        .btn-admin { background-color: #d97706; color: white; display: none; margin-left: auto; }
        
        .shayari-container { padding: 30px; min-height: 350px; }
        
        .shayari-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--secondary-color);
            padding: 22px 25px;
            margin-bottom: 25px;
            border-radius: 8px;
        }
        
        .card-header-meta { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .category-tag { background: rgba(56, 189, 248, 0.1); color: var(--secondary-color); padding: 3px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; }
        .views-count { font-size: 0.75rem; color: var(--text-muted); }

        .post-image { width: 100%; max-height: 380px; object-fit: cover; border-radius: 6px; margin-bottom: 15px; }

        .shayari-text {
            color: var(--text-main);
            font-size: 1.15rem;
            line-height: 1.8;
            white-space: pre-line;
            margin-bottom: 15px;
            font-family: Georgia, serif;
        }
        
        .card-footer { display: flex; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 12px; flex-wrap: wrap; gap: 10px; align-items: center; }
        .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-action { background: var(--border-color); color: var(--text-main); border: none; padding: 6px 12px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .btn-action:hover { background: var(--secondary-color); color: #030712; }
        
        .admin-controls { display: none; gap: 6px; }
        .btn-delete { background-color: #ef4444 !important; color: white !important; }
        .btn-edit { background-color: #eab308 !important; color: #030712 !important; font-weight: 700; }

        .share-buttons { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .btn-share { background: #1f2937; color: #38bdf8; font-size: 0.7rem; padding: 4px 10px; border-radius: 4px; text-decoration: none; border: 1px solid var(--border-color); }
        .btn-share:hover { background: #38bdf8; color: #030712; }

        .comments-section { margin-top: 18px; border-top: 1px solid var(--border-color); padding-top: 15px; }
        .comments-list { margin-bottom: 12px; max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .comment-item { font-size: 0.85rem; background: var(--bg-color); padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border-color); }
        .comment-item strong { color: var(--secondary-color); margin-right: 5px; }

        .comment-form-container { display: flex; flex-direction: column; gap: 6px; background: var(--bg-color); padding: 8px; border: 1px solid var(--border-color); border-radius: 8px; }
        .comment-name-input, .comment-text-input { width: 100%; padding: 6px 10px; font-size: 0.8rem; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 5px; outline: none; }
        .comment-submit-btn { padding: 6px 12px; font-size: 0.8rem; background: var(--secondary-color); color: #030712; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; align-self: flex-end; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.85); justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 12px; width: 90%; max-width: 420px; }
        .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 10px 14px; margin: 8px 0 16px 0; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; outline: none; }
        .modal-content button { width: 100%; padding: 10px; background: var(--secondary-color); color: #030712; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
        .close-btn { background: #ef4444 !important; color: white !important; margin-top: 8px !important; }
        
        footer { background: var(--card-bg); color: var(--text-muted); text-align: center; padding: 25px 20px; font-size: 0.85rem; border-top: 1px solid var(--border-color); }
        .social-links { display: flex; justify-content: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
        .social-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; text-decoration: none; border: 1px solid var(--border-color); color: var(--text-main); background: var(--bg-color); }
    </style>
</head>
<body>

            <div class="logo-container" onclick="handleLogoClick()">

        </header>
        
        <div class="controls">
            <div class="btn-group">
                <input type="text" id="searchInput" class="search-box" placeholder="🔍 शायरी या शब्द खोजें..." onkeyup="filterShayari()">
                <select id="categoryFilter" class="filter-select" onchange="filterShayari()">

    <!-- LOGIN MODAL -->

    <!-- ADD / EDIT POST MODAL -->
    <div class="modal" id="addModal">

            <h3 id="modalTitle">नई पोस्ट पब्लिश करें</h3>

                <option value="Dark Shayari">Dark Shayari</option>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8rwG8rCk9JYDljjhbjgrjp-paU-3s1jI",
            authDomain: "omniaura-in.firebaseapp.com",
            projectId: "omniaura-in",
            storageBucket: "omniaura-in.firebasestorage.app",
            messagingSenderId: "1089080974870",
            appId: "1:1089080974870:web:21746b784dafa8ab1b1f37",
            measurementId: "G-WEZSR6E7ZJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let shayariList = [];
        let isLoggedIn = localStorage.getItem('omniaura_loggedin') === 'true';
        let generatedOTP = "";
        let logoClickCount = 0;

        window.loadShayari = async function(filteredData = null) {
            const container = document.getElementById('shayari-content');
            
            if (!filteredData) {
                try {
                    const q = query(collection(db, "shayaris"), orderBy("createdAt", "desc"));
                    const querySnapshot = await getDocs(q);
                    shayariList = [];
                    querySnapshot.forEach((documentSnap) => {
                        shayariList.push({ id: documentSnap.id, ...documentSnap.data() });
                    });
                } catch (e) {
                    console.error("Error loading: ", e);
                    try {
                        const querySnapshot = await getDocs(collection(db, "shayaris"));
                        shayariList = [];
                        querySnapshot.forEach((documentSnap) => {
                            shayariList.push({ id: documentSnap.id, ...documentSnap.data() });
                        });
                    } catch (err) {
                        console.error("Fallback loading error: ", err);
                    }
                }

                // यदि डेटाबेस बिल्कुल खाली है, तो अपने आप एक डिफ़ॉल्ट शायरी जोड़ दें ताकि पेज खाली न दिखे
                if (shayariList.length === 0) {
                    try {
                        const defaultPost = {
                            category: "Dark Shayari",
                            image: "",
                            text: "अंधेरों से दोस्ती कुछ इस तरह हो गई,\nकि उजाला भी अब हमें डराने लगा है।\n\n- OmniAura.in",
                            likes: 1,
                            views: 10,
                            comments: [{ name: "Admin", text: "स्वागत है आपका OmniAura.in पर!" }],
                            createdAt: new Date()
                        };
                        const docRef = await addDoc(collection(db, "shayaris"), defaultPost);
                        shayariList.push({ id: docRef.id, ...defaultPost });
                    } catch (ex) {
                        console.error("Default post auto-add error:", ex);
                    }
                }
            }

            const dataToRender = filteredData || shayariList;
            let html = '';
            
            if (dataToRender.length === 0) {
                container.innerHTML = `<h2>कोई कंटेंट उपलब्ध नहीं है</h2>`;
                document.getElementById('add-shayari-btn').style.display = isLoggedIn ? "inline-block" : "none";
                return;
            }

            dataToRender.forEach((item) => {
                let imageHtml = item.image ? `<img src="${item.image}" class="post-image">` : '';
                let comments = item.comments || [];
                let commentsHtml = comments.map(c => `<div class="comment-item"><strong>${c.name}:</strong> ${c.text}</div>`).join('') || `<div class="comment-item" style="color:var(--text-muted)">कोई कमेंट नहीं।</div>`;
                let encodedText = encodeURIComponent(item.text || '');

                html += `
                    <div class="shayari-card">
                        <div class="card-header-meta">
                            <span class="category-tag">${item.category || 'Shayari'}</span>
                            <span class="views-count">👁 ${item.views || 10} बार देखा गया</span>
                        </div>
                        ${imageHtml}
                        <div class="shayari-text">${item.text || ''}</div>
                        
                        <div class="share-buttons">
                            <a href="https://api.whatsapp.com/send?text=${encodedText}%0A%0A-%20Shared%20via%20OmniAura.in" target="_blank" class="btn-share">💬 WhatsApp</a>
                            <a href="https://t.me/share/url?url=https://omniaura.in&text=${encodedText}" target="_blank" class="btn-share">✈ Telegram</a>
                            <a href="https://www.facebook.com/sharer/sharer.php?u=https://omniaura.in" target="_blank" class="btn-share">🌐 Facebook</a>
                        </div>

                        <div class="card-footer" style="margin-top: 12px;">
                            <div class="action-buttons">
                                <button class="btn-action" onclick="likeShayari('${item.id}')">❤️ लाइक (${item.likes || 0})</button>
                                <button class="btn-action" onclick="copyText('${encodedText}')">📋 कॉपी</button>
                            </div>
                            <div class="admin-controls" id="admin-controls-${item.id}" style="display: ${isLoggedIn ? 'flex' : 'none'};">
                                <button class="btn-action btn-edit" onclick="openEditModal('${item.id}')">✏️ एडिट</button>
                                <button class="btn-action btn-delete" onclick="deleteShayari('${item.id}')">🗑 डिलीट</button>
                            </div>
                        </div>

                        <div class="comments-section">
                            <div class="comments-list">${commentsHtml}</div>
                            <div class="comment-form-container">
                                <input type="text"
